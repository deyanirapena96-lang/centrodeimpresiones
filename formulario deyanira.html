
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pago - Centro de Impresiones</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="formulario">
        <h1>CENTRO DE IMPRESIONES</h1>
        <h2>Formulario de Pago</h2>

        <form id="formularioPago">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
                   placeholder="Ingrese su nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido"
                   placeholder="Ingrese su apellido" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo"
                   placeholder="Ingrese su correo" required>

            <label for="numero">Número de teléfono:</label>
            <input type="tel" id="numero" name="numero"
                   placeholder="Ingrese su número" required>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena"
                   placeholder="Ingrese su contraseña" required>

            <div class="recordar">
                <input type="checkbox" id="recordar" name="recordar">
                <label for="recordar">Recordar contraseña</label>
            </div>

            <label for="sexo">Sexo:</label>
            <select id="sexo" name="sexo" required>
                <option value="">Seleccione una opción</option>
                <option value="femenino">Femenino</option>
                <option value="masculino">Masculino</option>
                <option value="otro">Otro</option>
                <option value="no-indicar">Prefiero no indicarlo</option>
            </select>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad"
                   placeholder="Ingrese su edad" min="1" max="120" required>

            <h3>Datos de la tarjeta</h3>

            <label for="tarjeta">Número de tarjeta:</label>
            <input type="text" id="tarjeta" name="tarjeta"
                   placeholder="Número de tarjeta"
                   inputmode="numeric" autocomplete="cc-number"
                   maxlength="19" required>

            <label for="vencimiento">Fecha de vencimiento:</label>
            <input type="month" id="vencimiento" name="vencimiento"
                   autocomplete="cc-exp" required>

            <label for="cvv">CVV:</label>
            <input type="password" id="cvv" name="cvv"
                   placeholder="Código de seguridad"
                   inputmode="numeric" autocomplete="cc-csc"
                   maxlength="4" required>

            <button type="submit" class="mi-boton1">PAGAR</button>

            <button type="button" class="mi-boton2"
                    onclick="window.location.href='Login.html'">
                USUARIO
            </button>

            <p class="nota">Formulario de demostración académica.
                No procesa pagos reales.</p>
        </form>
    </div>

    <script>
        document.getElementById("formularioPago").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Formulario validado. Esta demostración no procesa pagos reales.");
        });
    </script>

</body>
</html>
